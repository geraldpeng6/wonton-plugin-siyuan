# 思源笔记插件：本地优先的个人知识库，块级引用、双链和 Markdown 所见即所得。
# 单容器：上游官方镜像跑内核 HTTP 服务，工作区（笔记、资源、配置、SQLite 索引）整体放在
# 插件数据目录，升级、重装保数据靠它。
#
# 登录（sso: none）：思源是单用户工作区，没有用户体系。锁屏密码用上游官方开关
# SIYUAN_ACCESS_AUTH_CODE_BYPASS 关掉（思源 README「Docker Hosting」一节），打开网页直达工作区，
# 没有第二次登录；能不能进来由云吞网关的会话决定，插件网络里只有核心和本插件的服务。
# 上游也支持 OIDC（SIYUAN_OIDC_*），但它的网页登录要求 https 回调地址（内核
# model/oidc.go 对非本机请求强制 https），而云吞的网页地址是 http，接不上，见仓库 README。
services:
  siyuan:
    # 上游官方镜像（b3log/siyuan，license: AGPL-3.0）。
    # 镜像按摘要固定（多架构清单的摘要，amd64/arm64），标签只给人看。
    image: b3log/siyuan:v3.8.9@sha256:4f9c119048b9dc685603b04aebf9e9d513695014c9fbd834e0dadd1c22801235
    # v3.7.0 起必须显式带 serve 子命令（上游 README）。
    command: ["serve", "--workspace=/siyuan/workspace"]
    environment:
      TZ: ${TZ}
      # 关掉锁屏密码（上游官方开关）：不设 --accessAuthCode，网页打开就是工作区。
      SIYUAN_ACCESS_AUTH_CODE_BYPASS: "true"
    volumes:
      # 工作区目录：上游默认容器路径就是 /siyuan/workspace，入口脚本按 PUID/PGID 调整属主。
      - ${WONTON_APP_DATA}/workspace:/siyuan/workspace
    healthcheck:
      # 真正可用：lsNotebooks 走到工作区的 SQLite 索引并返回笔记本列表，而不是只看进程活着。
      # 镜像是 alpine，用自带的 busybox wget。
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{}' http://127.0.0.1:6806/api/notebook/lsNotebooks | grep -q notebooks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
      start_interval: 5s

x-wonton:
  spec: "0.6"
  id: org.b3log.siyuan
  version: 0.1.0
  kind: app
  title: { zh: 思源笔记, en: SiYuan }
  description:
    zh: 在网页里写笔记：块级引用、双链、Markdown 所见即所得，数据都在自己家里
    en: Take block-level linked notes in the browser with Markdown WYSIWYG; the data stays at home
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/mobile-editor.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://b3log.org/siyuan
  # 上游应用的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: AGPL-3.0-only
  tags:
    zh: [笔记, 文档, Markdown]
    en: [Notes, Documents, Markdown]
  about:
    zh: |
      思源笔记的网页版：块级引用和双链、Markdown 所见即所得、大纲、反链面板、闪卡复习、数据库表格，多标签和分屏编辑。

      笔记、图片附件和索引全部存在这台服务器的插件数据目录里，本地优先；手机浏览器打开就是移动版布局，可以加到主屏。

      工作区只属于你：打开网页不用再登录，能不能进来由云吞的登录决定。集市主题和插件下载、云同步、AI 写作这些要连外网的功能默认用不了——本插件不申请出网权限，笔记数据只留在家里。
    en: |
      SiYuan in the browser: block-level references and backlinks, Markdown WYSIWYG, outlines, flashcards, database tables, multi-tab and split editing.

      Notebooks, assets and indexes all live in this server's plugin data directory, local-first; the phone browser gets the mobile layout and can be added to the home screen.

      The workspace is yours alone: no second sign-in after Wonton's own login. Marketplace downloads, cloud sync and AI writing need the internet and are unavailable by default — this plugin asks no outbound access, so notes never leave home.
  release_notes: { zh: 首个版本。, en: First release. }
  webui:
    service: siyuan
    port: 6806
    sso: none
  permissions: []
  # 多架构镜像；上游没有写部署内存下限，按开发机实测空载取整（实测见仓库 README）。
  requirements:
    arch: [amd64, arm64]
    memory: 512M
